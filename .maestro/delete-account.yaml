# Delete account: open it from the Profile tab, read what happens, enter the password, confirm, and land on the
# signed-out confirmation with the deletion date. Signing in again within 30 days cancels the deletion.
# Needs: an onboarded customer with no open bookings, disputes, refunds or unpaid earnings (a throwaway account:
# it is signed out and hidden). If something is open, the flow stops at the "A few things to finish first" list.
# Run: maestro test -e EMAIL=you@example.com -e PASSWORD=Secret123 -e OTP=123456 .maestro/delete-account.yaml
# Written for device / emulator runs; not run in CI.
appId: com.sydecrew.app
---
- launchApp
- runFlow:
    when:
      visible: "Log in"
    commands:
      - tapOn: "Log in"
      - tapOn: "Email or mobile number"
      - inputText: ${EMAIL}
      - tapOn: "Password"
      - inputText: ${PASSWORD}
      - tapOn: "Continue"
      - inputText: ${OTP}

- tapOn: "Profile"
- scrollUntilVisible:
    element: "Delete account"
- tapOn: "Delete account"
- extendedWaitUntil:
    visible: "What happens"
    timeout: 15000
- assertVisible:
    id: "delete-account-form"
- tapOn: "Your password"
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element: "Delete my account"
- tapOn: "I understand my account will be deleted.*"
- tapOn: "Delete my account"
- assertVisible: "Delete your account?"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Your account is scheduled for deletion"
    timeout: 15000
- assertVisible: "Changed your mind? Sign in before then to keep your account."
- tapOn: "Back to start"
- assertVisible: "Log in"
