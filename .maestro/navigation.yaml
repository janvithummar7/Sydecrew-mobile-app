# Customer shell smoke test: tabs, Discover, Bookings, Messages, SOS and safety, settings and legal.
# Needs: an onboarded customer account (EMAIL / PASSWORD below) and a dev API.
# Run: maestro test -e EMAIL=you@example.com -e PASSWORD=Secret123 -e OTP=123456 .maestro/navigation.yaml
appId: com.sydecrew.app
---
- launchApp
- runFlow:
    when:
      visible: "Log in"
    commands:
      - tapOn: "Log in"
      - tapOn: "Email or mobile number"
      - inputText: ${EMAIL}
      - tapOn: "Password"
      - inputText: ${PASSWORD}
      - tapOn: "Continue"
      - inputText: ${OTP}
# Discover: real results (Feature 3); the full flow is discovery.yaml.
- tapOn: "Discover"
- assertVisible: "Filters.*"
- assertNotVisible: "Sample — design preview only"
# Bookings (Feature 4): the real list with its tabs; no previews.
- tapOn: "Bookings"
- assertVisible: "Upcoming"
- assertVisible: "Cancelled"
- assertNotVisible: "Coming soon — not bookable yet"
# Messages (Feature 5): the real chat list; no placeholder.
- tapOn: "Messages"
- runFlow:
    when:
      visible: "Turn on notifications?"
    commands:
      - tapOn: "Not now"
- assertVisible: "One chat per booking.*"
- assertNotVisible: "Coming soon — not bookable yet"
# Profile -> Settings and legal: draft legal pages and the grievance officer placeholder.
- tapOn: "Profile"
- assertVisible: "Become a companion"
# SOS and safety (Feature 5): reachable without a booking; Call 112 first.
- scrollUntilVisible:
    element: "SOS and safety"
- tapOn: "SOS and safety"
- assertVisible: "Call 112 \\(emergency\\)"
- back
- scrollUntilVisible:
    element: "Settings and legal"
- tapOn: "Settings and legal"
- assertVisible: "Terms of use"
- assertVisible: "Draft — pending legal review"
- assertVisible: "Grievance officer"
