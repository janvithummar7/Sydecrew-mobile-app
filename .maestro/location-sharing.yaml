# Location sharing (Feature 5): booking day -> "Share my location" -> our explanation -> the system "while using"
# prompt -> sharing on -> off. FOREGROUND ONLY: there is no background location; the flow checks the notice.
# Needs: a CONFIRMED booking starting within 2 hours (or in progress) and at least one accepted safety contact.
#   maestro test -e EMAIL=you@example.com -e PASSWORD=Secret123 -e OTP=123456 .maestro/location-sharing.yaml
# Set a mock location on the emulator first (Extended controls -> Location).
# Written for device / emulator runs; not run in CI.
appId: com.sydecrew.app
---
- launchApp
- runFlow:
    when:
      visible: "Log in"
    commands:
      - tapOn: "Log in"
      - tapOn: "Email or mobile number"
      - inputText: ${EMAIL}
      - tapOn: "Password"
      - inputText: ${PASSWORD}
      - tapOn: "Continue"
      - inputText: ${OTP}
- tapOn: "Bookings"
- tapOn: "Upcoming"
- tapOn:
    text: ".*Confirmed.*|.*In progress.*"
    index: 0
- tapOn: "Booking day.*"
- scrollUntilVisible:
    element: "Share my location"
- tapOn:
    id: "location-share-switch"
- runFlow:
    when:
      visible: "Allow location while using Sydecrew?"
    commands:
      - assertVisible: ".*never tracks you in the background.*"
      - tapOn: "Continue"
# Android system prompt: only "While using the app" exists (no background permission is requested).
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- assertVisible: "Sharing your location"
- assertVisible: "Keep Sydecrew open: sharing pauses when the app is in the background."
- assertVisible: ".*safety contact.*"
# Turn it off again.
- tapOn:
    id: "location-share-switch"
- assertVisible: "Not sharing"
